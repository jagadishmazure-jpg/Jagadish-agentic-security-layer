[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-security-layer"
version = "0.1.0"
description = "Cross-cutting governance for AI agents: shadow detection, blast radius, governed bridge, ZSP posture"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["agelayer"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
